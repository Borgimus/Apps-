name: Verify guarded paper scaled sizing

on:
  pull_request:
    branches:
      - claude/options-trading-research-system-TIU0p

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out experiment branch
        uses: actions/checkout@v4
        with:
          ref: agent/paper-scaled-sizing-250-10
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install test dependencies
        run: python -m pip install --upgrade pip && pip install -r requirements.txt

      - name: Check Python syntax
        run: |
          python -m py_compile \
            app/config/settings.py \
            app/risk/paper_sizing.py \
            scripts/session_runner.py \
            app/evaluation/daily_report.py \
            app/evaluation/post_session.py \
            tests/test_paper_scaled_sizing.py

      - name: Run focused sizing tests
        run: pytest -q tests/test_paper_scaled_sizing.py

      - name: Compare complete suite with production baseline
        id: compare
        continue-on-error: true
        shell: bash
        run: |
          set +e
          set -o pipefail

          pytest -q tests 2>&1 | tee current-regression.txt
          current_status=${PIPESTATUS[0]}

          git worktree add /tmp/production-baseline origin/claude/options-trading-research-system-TIU0p
          cd /tmp/production-baseline
          pytest -q tests 2>&1 | tee "$GITHUB_WORKSPACE/baseline-regression.txt"
          baseline_status=${PIPESTATUS[0]}
          cd "$GITHUB_WORKSPACE"

          grep '^FAILED ' current-regression.txt | sed 's/ - .*//' | sort -u > current-failures.txt || true
          grep '^FAILED ' baseline-regression.txt | sed 's/ - .*//' | sort -u > baseline-failures.txt || true

          printf 'current_status=%s\nbaseline_status=%s\n' "$current_status" "$baseline_status" > regression-status.txt

          if [ "$current_status" -eq 0 ]; then
            exit 0
          fi

          if [ "$baseline_status" -ne 0 ] && diff -u baseline-failures.txt current-failures.txt > failure-diff.txt; then
            echo "Only matching production-baseline failures were observed." >> regression-status.txt
            exit 0
          fi

          diff -u baseline-failures.txt current-failures.txt > failure-diff.txt || true
          exit 1

      - name: Upload regression comparison
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: complete-regression-comparison
          path: |
            current-regression.txt
            baseline-regression.txt
            current-failures.txt
            baseline-failures.txt
            failure-diff.txt
            regression-status.txt

      - name: Stop on new regression failure
        if: steps.compare.outcome == 'failure'
        run: exit 1
