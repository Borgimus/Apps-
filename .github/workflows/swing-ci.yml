name: swing-ci

# CI is for tests and static checks ONLY. GitHub Actions is NOT the intraday
# trading runtime — the bot runs on a persistent Linux host (see docs/).
on:
  push:
    paths:
      - "src/**"
      - "tests_swing/**"
      - "config/strategy.yaml"
      - "pytest_swing.ini"
      - ".github/workflows/swing-ci.yml"
  pull_request:
    paths:
      - "src/**"
      - "tests_swing/**"
      - "config/strategy.yaml"
      - "pytest_swing.ini"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install swing test deps (stdlib + pyyaml + pytest)
        run: python -m pip install --upgrade pip pytest pyyaml
      - name: Run deterministic swing suite
        run: pytest -c pytest_swing.ini
      - name: Secret scan (guard against committed .env / keys)
        run: pytest -c pytest_swing.ini tests_swing/test_secret_leak.py

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install linters
        run: python -m pip install --upgrade pip ruff
      - name: Ruff (lint + format check) on swing sources
        run: |
          ruff check src tests_swing || true
          ruff format --check src tests_swing || true
