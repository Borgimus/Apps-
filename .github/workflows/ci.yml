name: CI

on:
  push:
    branches: ["main", "claude/**", "agent/**"]
  pull_request:
    branches: ["main", "agent/**"]

jobs:
  # ── Required gate ─────────────────────────────────────────────────────────
  # Every test must pass before a merge is allowed. There is no quarantine:
  # a failing test is either fixed or deleted with a stated reason.
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: requirements.lock

      - name: Install pinned dependencies
        run: pip install -r requirements.lock

      - name: Syntax check (compile all .py files)
        run: |
          find app scripts -name "*.py" | xargs python -m py_compile

      - name: Run test suite
        run: |
          python -m pytest tests/ -q --tb=short -p no:warnings
