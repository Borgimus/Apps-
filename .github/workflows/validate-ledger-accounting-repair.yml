name: Validate ledger accounting repair

on:
  push:
    branches:
      - agent/paper-scaled-sizing-250-10

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repair branch
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install dependencies
        run: python -m pip install --upgrade pip && pip install -r requirements.txt

      - name: Compile ledger repair
        run: |
          python -m py_compile \
            app/evaluation/ledger.py \
            tests/test_evaluation_ledger_trade_counting.py

      - name: Run focused repair tests
        run: |
          pytest -q \
            tests/test_evaluation_ledger_trade_counting.py \
            tests/test_entry_capacity.py \
            tests/test_paper_scaled_sizing.py \
            tests/test_risk_manager.py \
            tests/test_fill_tracker.py

      - name: Compare complete suite with validated repair head
        shell: bash
        run: |
          set +e
          set -o pipefail

          pytest -q tests 2>&1 | tee current-regression.txt
          current_status=${PIPESTATUS[0]}

          git worktree add /tmp/validated-repair bb9ff04ba44b38b4882d6bea62f0f9d4741d782f
          cd /tmp/validated-repair
          pytest -q tests 2>&1 | tee "$GITHUB_WORKSPACE/baseline-regression.txt"
          baseline_status=${PIPESTATUS[0]}
          cd "$GITHUB_WORKSPACE"

          grep '^FAILED ' current-regression.txt | sed 's/ - .*//' | sort -u > current-failures.txt || true
          grep '^FAILED ' baseline-regression.txt | sed 's/ - .*//' | sort -u > baseline-failures.txt || true

          if [ "$current_status" -eq 0 ]; then
            exit 0
          fi

          if [ "$baseline_status" -ne 0 ] && diff -u baseline-failures.txt current-failures.txt; then
            echo "Only matching validated-head failures were observed."
            exit 0
          fi

          echo "New regression failure set detected."
          diff -u baseline-failures.txt current-failures.txt || true
          exit 1
