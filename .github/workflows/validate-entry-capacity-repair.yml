name: Validate pending entry capacity repair

on:
  push:
    branches:
      - agent/paper-scaled-sizing-250-10
  pull_request:
    branches:
      - claude/options-trading-research-system-TIU0p

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repair branch
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install dependencies
        run: python -m pip install --upgrade pip && pip install -r requirements.txt

      - name: Compile repaired paths
        run: |
          python -m py_compile             app/risk/entry_capacity.py             app/risk/risk_manager.py             app/trading/fill_tracker.py             app/trading/reconciler.py             scripts/session_runner.py             tests/test_entry_capacity.py

      - name: Run focused repair tests
        run: |
          pytest -q             tests/test_entry_capacity.py             tests/test_paper_scaled_sizing.py             tests/test_risk_manager.py             tests/test_fill_tracker.py

      - name: Compare complete suite with production baseline
        shell: bash
        run: |
          set +e
          set -o pipefail

          pytest -q tests 2>&1 | tee current-regression.txt
          current_status=${PIPESTATUS[0]}

          git fetch origin claude/options-trading-research-system-TIU0p
          git worktree add /tmp/production-baseline origin/claude/options-trading-research-system-TIU0p
          cd /tmp/production-baseline
          pytest -q tests 2>&1 | tee "$GITHUB_WORKSPACE/baseline-regression.txt"
          baseline_status=${PIPESTATUS[0]}
          cd "$GITHUB_WORKSPACE"

          grep '^FAILED ' current-regression.txt | sed 's/ - .*//' | sort -u > current-failures.txt || true
          grep '^FAILED ' baseline-regression.txt | sed 's/ - .*//' | sort -u > baseline-failures.txt || true

          if [ "$current_status" -eq 0 ]; then
            exit 0
          fi

          if [ "$baseline_status" -ne 0 ] && diff -u baseline-failures.txt current-failures.txt; then
            echo "Only matching production-baseline failures were observed."
            exit 0
          fi

          echo "New regression failure set detected."
          diff -u baseline-failures.txt current-failures.txt || true
          exit 1
