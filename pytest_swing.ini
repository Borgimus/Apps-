# Isolated pytest config for the TC2000+Alpaca swing-trading deterministic suite.
# The legacy options-system suite lives under tests/ with its own heavy-dependency
# conftest; this suite is dependency-light (stdlib + pyyaml) and self-contained.
#
#   pytest -c pytest_swing.ini
#
[pytest]
testpaths = tests_swing
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = -q
