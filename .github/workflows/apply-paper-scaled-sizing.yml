name: Verify guarded paper scaled sizing

on:
  pull_request:
    branches:
      - claude/options-trading-research-system-TIU0p

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out experiment branch
        uses: actions/checkout@v4
        with:
          ref: agent/paper-scaled-sizing-250-10
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install test dependencies
        run: python -m pip install --upgrade pip && pip install -r requirements.txt

      - name: Check Python syntax
        run: |
          python -m py_compile \
            app/config/settings.py \
            app/risk/paper_sizing.py \
            scripts/session_runner.py \
            app/evaluation/daily_report.py \
            app/evaluation/post_session.py \
            tests/test_paper_scaled_sizing.py

      - name: Run focused sizing tests
        run: pytest -q tests/test_paper_scaled_sizing.py

      - name: Run remaining regression tests
        run: pytest -q tests --ignore=tests/test_alerts.py --maxfail=1

      - name: Compare full suite with production baseline
        shell: bash
        run: |
          set +e
          set -o pipefail

          pytest -q tests --maxfail=1 2>&1 | tee current-regression.txt
          current_status=${PIPESTATUS[0]}

          git worktree add /tmp/production-baseline origin/claude/options-trading-research-system-TIU0p
          cd /tmp/production-baseline
          pytest -q tests --maxfail=1 2>&1 | tee "$GITHUB_WORKSPACE/baseline-regression.txt"
          baseline_status=${PIPESTATUS[0]}
          cd "$GITHUB_WORKSPACE"

          if [ "$current_status" -eq 0 ]; then
            echo "Current branch regression suite passed."
            exit 0
          fi

          grep '^FAILED ' current-regression.txt > current-failures.txt || true
          grep '^FAILED ' baseline-regression.txt > baseline-failures.txt || true

          echo "Current failures:"
          cat current-failures.txt || true
          echo "Baseline failures:"
          cat baseline-failures.txt || true

          if [ "$baseline_status" -ne 0 ] && diff -u baseline-failures.txt current-failures.txt; then
            echo "Only the same pre-existing production-baseline failure was observed."
            exit 0
          fi

          echo "The experiment branch introduced a new regression failure."
          exit 1
