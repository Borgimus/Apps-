name: Apply guarded paper scaled sizing

on:
  push:
    branches:
      - agent/paper-scaled-sizing-250-10
    paths:
      - .github/workflows/apply-paper-scaled-sizing.yml
      - scripts/apply_paper_scaled_sizing_repo_update.py
  pull_request:
    branches:
      - claude/options-trading-research-system-TIU0p

permissions:
  contents: write

jobs:
  apply-and-test:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out experiment branch
        uses: actions/checkout@v4
        with:
          ref: agent/paper-scaled-sizing-250-10
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Apply repository update
        run: python scripts/apply_paper_scaled_sizing_repo_update.py

      - name: Check syntax and whitespace
        run: |
          python -m py_compile \
            app/config/settings.py \
            app/risk/paper_sizing.py \
            scripts/session_runner.py \
            app/evaluation/daily_report.py \
            app/evaluation/post_session.py \
            tests/test_paper_scaled_sizing.py
          git diff --check

      - name: Install test dependencies
        run: python -m pip install --upgrade pip && pip install -r requirements.txt

      - name: Run focused sizing tests
        run: pytest -q tests/test_paper_scaled_sizing.py

      - name: Run regression suite
        id: regression
        continue-on-error: true
        run: pytest -q tests --maxfail=1 2>&1 | tee regression-output.txt

      - name: Upload regression output
        if: steps.regression.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: regression-output
          path: regression-output.txt

      - name: Stop on regression failure
        if: steps.regression.outcome == 'failure'
        run: exit 1

      - name: Commit tested implementation
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Implement guarded paper scaled sizing experiment'
          git push origin HEAD:agent/paper-scaled-sizing-250-10
